<title>Hand of Realms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : table de guerre. Bandeau adverse, plateau 8x5 au centre, main du joueur actif en bas, journal à côté. */
:root {
  --bg: #e9ebe6; --surface: #f6f7f3; --line: #c5cabd; --fg: #1f2420; --muted: #5d665c;
  --cell: #dde1d6; --cell-alt: #d3d8cb;
  --p1: #2f6fb0; --p1-soft: #d6e4f3; --p2: #b4442f; --p2-soft: #f3dcd6;
  --gold: #a7781c; --move: #7fa35a; --danger: #c0392b;
  --display: "Alegreya SC", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151816; --surface: #1d211e; --line: #343b35; --fg: #e5e8e2; --muted: #9aa395;
  --cell: #252a26; --cell-alt: #2b312c; --p1: #6ea6e0; --p1-soft: #1d3247; --p2: #e07a63; --p2-soft: #47241d;
  --gold: #d9a940; --move: #93b86b; --danger: #ef6b5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151816; --surface: #1d211e; --line: #343b35; --fg: #e5e8e2; --muted: #9aa395;
  --cell: #252a26; --cell-alt: #2b312c; --p1: #6ea6e0; --p1-soft: #1d3247; --p2: #e07a63; --p2-soft: #47241d;
  --gold: #d9a940; --move: #93b86b; --danger: #ef6b5a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; margin: 0; text-wrap: balance }
h1 { font-size: 1.6rem } h2 { font-size: 1.05rem }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
html, body { height: 100% }
.wrap { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px }
.sub { color: var(--muted) }
.setup { align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; max-width: 520px }
.setup label { display: grid; gap: 4px; font-weight: 500 }
.setup select, .setup input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg) }
.primary { background: var(--fg); color: var(--bg); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 600 }
.primary:disabled { opacity: .4; cursor: default }
.game { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; min-height: 0 }
@media (max-width: 820px) { .game { grid-template-columns: minmax(0, 1fr) } .wrap { height: auto } .board-area { height: 62vw } .side { max-height: none } }
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; gap: 8px; min-width: 0; min-height: 0 }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line) }
.bar.active { border-color: currentColor }
.bar.p1 { color: var(--p1) } .bar.p2 { color: var(--p2) }
.bar > * { color: var(--fg) }
.bar .who { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: inherit }
.stat { font-family: var(--mono); font-variant-numeric: tabular-nums }
.pips { display: inline-flex; gap: 3px; vertical-align: middle }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--gold) }
.pip.full { background: var(--gold) }
.board-area { container-type: size; min-height: 240px; display: grid; place-items: center }
.board-wrap { width: min(100cqw, calc(100cqh * 1.62)); overflow: hidden }
.board { display: grid; grid-template-columns: 18px repeat(8, minmax(0, 1fr)); gap: 3px }
.axis { font-family: var(--mono); font-size: 11px; color: var(--muted); display: grid; place-items: center }
.cell { aspect-ratio: 1; border: 0; border-radius: 6px; background: var(--cell); position: relative; padding: 2px; display: grid; place-items: center; min-width: 0; overflow: hidden }
.cell.alt { background: var(--cell-alt) }
.cell.deploy { box-shadow: inset 0 0 0 2px var(--gold) }
.cell.move { background: color-mix(in srgb, var(--move) 35%, var(--cell)) }
.cell.attack { box-shadow: inset 0 0 0 3px var(--danger) }
.cell.sel { box-shadow: inset 0 0 0 3px var(--fg) }
.unit { width: 100%; height: 100%; border-radius: 5px; display: grid; grid-template-rows: 1fr auto; padding: 3px; text-align: center; color: #fff }
.unit.o0 { background: var(--p1) } .unit.o1 { background: var(--p2) }
.unit.done { filter: saturate(.35) brightness(.8) }
.unit .nm { font-size: clamp(8px, 1.2vw, 15px); font-weight: 600; line-height: 1.1; overflow: hidden; align-self: center; overflow-wrap: break-word; hyphens: auto }
.unit .st { font-family: var(--mono); font-size: clamp(9px, 1.3vw, 16px); display: flex; justify-content: space-between }
.unit .rg { position: absolute; top: 3px; right: 5px; font-size: 10px; opacity: .85 }
.crystal { width: 82%; height: 82%; clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); display: grid; place-items: center; color: #fff; font-family: var(--mono); font-weight: 500 }
.crystal.o0 { background: var(--p1) } .crystal.o1 { background: var(--p2) }
.hand { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px }
.card { flex: 0 0 116px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; display: grid; gap: 4px; align-content: start }
.card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) }
.card.poor { opacity: .5 }
.card .cost { font-family: var(--mono); color: var(--gold); font-weight: 500 }
.card .nm { font-weight: 600; line-height: 1.15 }
.card .meta { font-size: 12px; color: var(--muted) }
.side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-width: 0; min-height: 0 }
.side .panel:last-child { min-height: 0; grid-template-rows: auto minmax(0, 1fr) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0 }
.log { font-size: 12.5px; overflow-y: auto; min-height: 0; display: grid; gap: 3px; color: var(--muted) }
.log div:last-child { color: var(--fg) }
.err { color: var(--danger); font-weight: 500; min-height: 1.2em }
.win { font-family: var(--display); font-size: 1.4rem; color: var(--gold) }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px }
@media (prefers-reduced-motion: no-preference) { .cell, .card { transition: background-color .12s, box-shadow .12s } }
</style>
<div class="wrap" id="app"></div>
<script>/*BUNDLE*/</script>
